<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>Report language harness</title>
<script src="../i18n-report.js"></script>
<script src="../core.js"></script>
<script src="../lib/jspdf.umd.min.js"></script>
<script src="../lib/docx.iife.js"></script>
<script src="../lib/exceljs.min.js"></script>
</head>
<body>
<script>
const Z = window.ZCORE;
function rasterize(svgStr, W, H, scale) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" }));
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = Math.round(W * scale); c.height = Math.round(H * scale);
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("svg raster failed")); };
    img.src = url;
  });
}
function blobB64(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(",")[1]);
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(blob);
  });
}
function darkPixels(c) {
  const ctx = c.getContext("2d");
  const d = ctx.getImageData(0, 0, c.width, c.height).data;
  let n = 0;
  const step = 16;
  for (let i = 0; i < d.length; i += 4 * step) if (d[i] < 245 || d[i + 1] < 245 || d[i + 2] < 245) n++;
  return n;
}
window.runReport = async function (sec, meta, opts) {
  opts = opts || {};
  const out = { lang: meta.lang, errors: [] };
  try {
    if (meta.lang === "zh") {
      meta.svgFontCss = await Z.loadCjkFontCss(Z.reportSampleText(sec, meta));
      out.fontCss = (meta.svgFontCss || "").length;
      out.fontEmbedded = /@font-face/.test(meta.svgFontCss || "") && /base64/.test(meta.svgFontCss || "");
    }
    const pages = Z.buildReportPages(sec, meta, null, null, "A3", true, true);
    out.pages = pages.length;
    out.svg = pages.map((p) => p.svg).join("\n");
    out.csv = Z.buildCSV(sec, meta);
    out.dxf = Z.buildDXF(sec, meta);
    out.info = Z.reportTables(sec, meta).info;
    const scale = opts.scale || (140 / 96);
    const c0 = await rasterize(pages[0].svg, pages[0].W, pages[0].H, scale);
    out.png = c0.toDataURL("image/png");
    out.dark = darkPixels(c0);
    if (opts.pdf) {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: "landscape", unit: "mm", format: "a3", compress: true });
      pdf.addImage(c0, "PNG", 0, 0, 420, 297, undefined, "FAST");
      if (pages.length > 1) {
        const c1 = await rasterize(pages[1].svg, pages[1].W, pages[1].H, 110 / 96);
        pdf.addPage("a3", "landscape");
        pdf.addImage(c1, "PNG", 0, 0, 420, 297, undefined, "FAST");
      }
      const title = meta.lang === "mn" ? "Cross-section A-A' " + (sec.projectId || "") : (meta.title + " · " + (sec.projectId || ""));
      try { pdf.setProperties({ title, creator: "RegaPro" }); } catch (e) { out.errors.push("pdfmeta " + e.message); }
      out.pdf = await blobB64(pdf.output("blob"));
    }
    if (opts.docx) {
      const sheetImg = { data: new Uint8Array(await (await fetch(out.png)).arrayBuffer()), dataUrl: out.png, wPx: c0.width, hPx: c0.height };
      const blob = await window.docx.Packer.toBlob(Z.buildDocx(window.docx, sec, meta, sheetImg, null, "A3"));
      out.docx = await blobB64(blob);
    }
    if (opts.xlsx) {
      const sheetImg = { dataUrl: out.png, wPx: c0.width, hPx: c0.height };
      const buf = await Z.buildXlsx(window.ExcelJS, sec, meta, sheetImg, null).xlsx.writeBuffer();
      out.xlsx = await blobB64(new Blob([buf]));
    }
  } catch (e) {
    out.errors.push(String(e && e.stack || e));
  }
  return out;
};
</script>
</body>
</html>
